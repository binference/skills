name: Release CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        working-directory: cli
        run: test "cli-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run lint
        working-directory: cli
      - run: npm test
        working-directory: cli
      - run: npm publish --provenance
        working-directory: cli
