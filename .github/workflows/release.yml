name: Release CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        working-directory: cli
        run: test "cli-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run lint
        working-directory: cli
      - run: npm test
        working-directory: cli
      - name: Skip a version already on npm
        id: published
        working-directory: cli
        run: |
          if npm view "binference@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --provenance
        if: steps.published.outputs.done != 'true'
        working-directory: cli
